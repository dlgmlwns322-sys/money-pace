// 메모 카드 금액은 선택 입력이라 입력 안 하면 실제로 쓴 돈이 있어도 0으로 잡히는 문제가 있어서
// "오늘 쓸 수 있는 돈" 등 다른 곳과 동일하게 캡처 잔액 차이 기반으로 계산하도록 통일.
let weekBarsData=[];
function renderWeekBars(){
  const wrap=document.getElementById('wk2Bars');
  if(!wrap)return;
  const{weekStartStr}=getWeekInfo();
  const[sy,sm,sd]=weekStartStr.split('-').map(Number);
  const todayS=toStr();
  const labels=['월','화','수','목','금','토','일'];
  const days=labels.map((label,i)=>{
    const dt=new Date(Date.UTC(sy,sm-1,sd+i));
    const ds=dt.toISOString().slice(0,10);
    const daily=getDailySpent(ds);
    // 잔액이 늘어난 날(입금/충전)도 막대에 표시 — spent<0이면 입금, amt는 절대값으로 저장
    const isIncome=!!(daily&&!daily.noCaptureToday&&daily.spent<0);
    const amt=(daily&&!daily.noCaptureToday&&daily.spent)?Math.abs(daily.spent):0;
    return{ds,label,amt,isIncome,isToday:ds===todayS};
  });
  weekBarsData=days;
  const maxAmt=Math.max(1,...days.map(d=>d.amt));
  const wkSpent=getWeeklySpent();
  const weekTotal=wkSpent?wkSpent.spent:days.reduce((a,d)=>a+(d.isIncome?-d.amt:d.amt),0);
  const wBudget=weeklyShare();
  const rangeEl=document.getElementById('wk2Range');
  if(rangeEl)rangeEl.textContent=`${weekTotal.toLocaleString('ko-KR')} / ${wBudget.toLocaleString('ko-KR')}원`;
  wrap.innerHTML=days.map((d,i)=>{
    const h=d.amt>0?Math.max(16,Math.round((d.amt/maxAmt)*62)):16;
    const barColor=d.isIncome?'var(--green)':(d.isToday?'var(--ind)':(d.amt>0?'var(--bar-n)':'var(--bar-l)'));
    return`<div class="wk2-bar-col" onclick="showWeekBarInfo(${i})"><div class="wk2-tip num hidden" id="wk2Tip${i}"></div><div class="wk2-bar" style="height:${h}px;background:${barColor};"></div><span class="wk2-bar-lbl${d.isToday?' hi':''}">${d.label}</span></div>`;
  }).join('');
  const defaultIdx=days.findIndex(d=>d.isToday);
  showWeekBarInfo(defaultIdx>=0?defaultIdx:days.length-1);
}
function showWeekBarInfo(idx){
  const d=weekBarsData[idx];
  if(!d)return;
  weekBarsData.forEach((_,i)=>{
    const tip=document.getElementById(`wk2Tip${i}`);
    if(!tip)return;
    const day=weekBarsData[i];
    tip.classList.toggle('hidden',i!==idx||day.amt<=0);
    if(i===idx&&day.amt>0){
      tip.textContent=(day.isIncome?'+':'')+won(day.amt);
      tip.style.background=day.isIncome?'var(--green)':'';
    }
  });
}

// 손으로 체크할 때 이을 출금: 이번 주기(알림 시작 뒤~오늘)의 예정액 ±20%(최소 1,000원) 출금 중 금액이 가장 가깝고 최근인 것.
// 같은 금액이 딱 한 건이면 묻지 않고 잇고, 금액이 조금 다르거나 여러 건이거나 전에 연결을 푼 거래거나
// 그 출금과 금액이 똑같은 다른 미연결 항목이 있으면(복싱·필라테스 둘 다 10만 등 — 누구 것인지 모름) 한 번 묻는다(2026-10-01 사용자 결정).
function checkLinkPick(f){
  if(!S.txSince||!S.budgetStart||f.type==='income'||f.affectsBalance===false||!(f.amount>0))return null;
  const today=toStr(),amt=f.amount,no=S.fixedNo||[];
  const used=new Set((S.fixed||[]).filter(x=>x!==f&&x.txId!=null).map(x=>x.txId));
  const near=txWithFlags().filter(r=>r.type==='out'&&!r.isTransfer&&r.date>=S.budgetStart&&r.date>=S.txSince&&r.date<=today
    &&!used.has(r.id)&&!no.includes(f.id+':'+r.id)&&Math.abs(r.amount-amt)<=Math.max(1000,amt*0.2))
    .sort((a,b)=>Math.abs(a.amount-amt)-Math.abs(b.amount-amt)||Date.parse(b.at)-Date.parse(a.at)||b.id-a.id);
  if(!near.length)return null;
  const r=near[0],exact=near.filter(x=>x.amount===amt);
  const rival=(S.fixed||[]).some(x=>x!==f&&x.type!=='income'&&x.txId==null&&x.amount===r.amount);
  return{r,ask:!(exact.length===1&&r.id!==f.skipTx)||rival};
}
// 체크: 이을 출금이 있으면 그 출금과 연결하고 날짜도 출금일로(없거나 거절하면 오늘 날짜, 거절한 거래는 그 체크 동안 다시 권하지 않음).
// 체크 해제: 연결도 푼다(예전엔 txId가 남아 그 출금이 계속 지출에서 빠지고 다음 날부터 미납으로 또 빠졌다).
//   연결을 푼 항목은 이번 주기 동안 알림 이름으로 자동 연결하지 않고(skipIn), 푼 거래는 다시 체크할 때 묻는다(skipTx).
//   '아니에요' 기록도 지운다 → 잘못 거절했으면 풀었다 다시 체크하면 다시 묻는다.
function toggleFixed(id){
  const f=S.fixed.find(x=>x.id===id);if(!f)return;
  const before=f.paidDate;
  let msg='';
  // 연결 풀기(예전 버전이 남긴 '미납인데 연결'도 여기서 정리)
  if(f.txId!=null){f.skipTx=f.txId;f.skipIn=S.budgetStart;delete f.txId;delete f.actual;}
  if(f.paid){
    f.paid=false;f.paidDate='';
    S.fixedNo=(S.fixedNo||[]).filter(k=>!k.startsWith(f.id+':'));
  }else{
    const pick=checkLinkPick(f);
    f.paid=true;f.paidDate=toStr();
    if(pick){
      const r=pick.r,md=r.date.slice(5).replace('-','/');
      if(!pick.ask||confirm(`${md} ${r.merchant||r.counterparty||''} ${won(r.amount)} 출금이 '${f.name}'인가요?\n\n[확인] 이 출금과 연결\n[취소] 오늘 날짜로 체크만`)){
        f.paidDate=r.date;f.txId=r.id;f.actual=r.amount;delete f.skipTx;delete f.skipIn;msg=`${md} 출금 ${won(r.amount)}과 연결했어요`;
      }else S.fixedNo=[...(S.fixedNo||[]),f.id+':'+r.id];
    }
  }
  recomputeClosedCycles([before,f.paidDate]);
  save();renderFixed();render();
  if(msg)showToast(msg);
}
// 마감된 주기 결산(spent)은 저장값이라, 그 기간의 고정비 납부 표시가 바뀌면 다시 계산해야 한다.
// 바로 덮어쓰지 않고 '불완전'으로 표시만 한다 → 곧바로 그 주기 범위를 서버에서 끝까지 다시 받고,
// 빠짐없이 받았을 때만 applyTxToState가 다시 계산해 확정한다(이 기기 캐시에 빈 곳이 있어도 결산이 틀어지지 않게).
// 거래 알림 기간과 겹치고 서버 보관 기간(45일) 안인 주기만. 그보다 오래된 주기는 다시 받을 수 없어 기존 값 유지.
function recomputeClosedCycles(paidDates){
  if(!S.txSince)return;
  const days=new Set();paidDates.filter(Boolean).forEach(p=>{days.add(p);days.add(dayBefore(p));});
  let marked=false;
  (S.cycles||[]).forEach(c=>{
    if(c.end<S.txSince||![...days].some(d=>c.start<=d&&d<=c.end)||!txRecoverable(c))return;
    c.incomplete=true;marked=true;
  });
  if(marked&&S.txReadSecret){
    if(txFetching)txRefetchPending=true; // 지금 받는 중이면(그 읽기엔 이 주기 범위가 없을 수 있음) 끝난 뒤 다시
    else{TX.lastFetch=0;setTimeout(()=>refreshAndRoll(),0);}
  }
}

// 체크된 고정지출의 빠져나간 날짜 수정 (연필 클릭 → 달력)
function editFixedDate(id){
  const f=S.fixed.find(x=>x.id===id);
  if(!f||!f.paid)return;
  // 출금과 연결된 항목의 날짜는 출금일이다(바꾸면 이미 나간 돈을 그날 시작 잔액에서 또 뺀다). 바꾸려면 체크를 풀었다 다시.
  if(f.txId!=null){showToast('출금과 연결돼 있어 날짜를 바꿀 수 없어요');return;}
  const inp=document.createElement('input');
  inp.type='date';
  inp.value=f.paidDate||toStr();
  inp.max=toStr();
  inp.style.cssText='position:fixed;left:50%;top:50%;opacity:0;width:1px;height:1px;pointer-events:none;';
  document.body.appendChild(inp);
  let done=false;
  const cleanup=()=>{if(!done){done=true;if(inp.parentNode)inp.parentNode.removeChild(inp);}};
  inp.addEventListener('change',()=>{
    if(inp.value){const before=f.paidDate;f.paidDate=inp.value;recomputeClosedCycles([before,f.paidDate]);save();renderFixed();render();showToast('빠져나간 날짜를 수정했어요 ✓');}
    cleanup();
  });
  inp.addEventListener('blur',()=>setTimeout(cleanup,250));
  setTimeout(()=>{
    if(inp.showPicker){try{inp.showPicker();return;}catch(e){}}
    inp.focus();inp.click();
  },0);
}

// 설정 링크: 앱 주소#setup=<base64url JSON {u:Supabase URL, k:anon 키, t:읽기 키, n:내 이름}> 를 한 번 열면 이 기기에 저장.
// # 뒤는 서버로 전송되지 않는다. 저장 후 주소창에서 바로 지운다. 연결 값은 화면에 보이지 않는다.
function applySetupLink(){
  const m=/[#&]setup=([A-Za-z0-9_-]+)/.exec(location.hash||'');
  if(!m)return false;
  if(isStale()){location.reload();return false;} // 다른 탭이 저장한 뒤면 링크를 지우기 전에 새로 읽는다(새로 읽으면 시작할 때 적용)
  try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}
  let c;try{c=JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g,'+').replace(/_/g,'/')))));}catch(e){c=null;}
  // 검사: 모든 값은 문자열, 주소는 https://*.supabase.co, 주소와 anon 키는 반드시 함께(예전 키가 다른 주소로 가지 않게)
  const str=v=>v==null||typeof v==='string';
  const norm=u=>String(u||'').trim().replace(/\/+$/,'');
  if(!c||typeof c!=='object'||!['u','k','t','n'].every(k=>str(c[k]))||!c.u||!c.k||!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(norm(c.u))){
    showToast('설정 링크가 올바르지 않아요');return false;
  }
  const url=norm(c.u),prev={u:S.supabaseUrl,k:S.supabaseKey,t:S.txReadSecret,n:S.ownerNames},prevRev=syncMeta.rev;
  const urlChanged=url!==norm(S.supabaseUrl);
  // 이미 다른 곳에 연결돼 있으면 바꾸기 전에 확인
  if(S.supabaseUrl&&urlChanged&&!confirm('다른 저장소로 연결을 바꿀까요?'))return false;
  S.supabaseUrl=url;S.supabaseKey=c.k.trim();
  if(c.t!=null)S.txReadSecret=c.t.trim();else if(urlChanged)S.txReadSecret='';
  if(c.n!=null){S.ownerNames=c.n.trim();pendingOwnerName=S.ownerNames;}
  if(urlChanged){delete syncMeta.rev;saveSyncMeta();}
  if(!save()){ // 저장 실패면 원래대로
    S.supabaseUrl=prev.u;S.supabaseKey=prev.k;S.txReadSecret=prev.t;S.ownerNames=prev.n;
    if(urlChanged){if(prevRev===undefined)delete syncMeta.rev;else syncMeta.rev=prevRev;saveSyncMeta();}
    return false;
  }
  showToast('연결됐어요 ✓');
  return true;
}

// 클라우드에서 수동으로 불러오기 (다른 기기 데이터 가져올 때)


const TABS=['home','capture','fixed','settings'];
// 홈은 디자인상 최상단에 타이틀 없이 바로 히어로 카드로 시작 — 나머지 탭만 화면명을 상단에 표시
const TAB_TITLES={home:'',capture:'거래',fixed:'고정지출',settings:'설정'};
function showTab(name){
  TABS.forEach(t=>{
    document.getElementById('tab-'+t).classList.toggle('hidden',t!==name);
    const n=document.getElementById('nav-'+t);if(n)n.classList.toggle('active',t===name);
  });
  document.querySelectorAll('.tab').forEach((b,i)=>b.classList.toggle('active',TABS[i]===name));
  document.getElementById('appHeader').classList.toggle('hidden',name==='home');
  document.getElementById('headerTitle').textContent=TAB_TITLES[name]||'';
}

let tTimer;
function showToast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(tTimer);tTimer=setTimeout(()=>el.classList.remove('show'),2500);}

render();

// 앱 시작 시: 클라우드 동기화 → 공유 이미지 체크 (AI 코멘트는 자동 생성 안 함)
slimOldBackups();
try{if(sessionStorage.getItem('mp_stale_reload')){sessionStorage.removeItem('mp_stale_reload');setTimeout(()=>showToast('다른 창에서 바뀐 내용을 불러왔어요. 방금 바꾼 게 있으면 다시 해 주세요'),300);}}catch(e){}
// 이미 열린 앱 창에서 설정 링크를 열면 주소의 # 뒤만 바뀌어 새로 읽지 않는다 → 그때도 적용(검토 반영)
window.addEventListener('hashchange',()=>{if(/[#&]setup=/.test(location.hash)&&applySetupLink()){TX.lastFetch=0;refreshAndRoll();}});
applySetupLink();
(async function initApp(){
  if(S.supabaseUrl&&S.supabaseKey){
    const ok=await serialSync(syncOnStart);
    if(ok)render();
  }
  // 은행 알림으로 기록된 새 거래를 먼저 받고(주기 마감 합계에 넣기 위해), 예산 주기가 끝났으면 다음 주기로 넘긴다
  await refreshAndRoll();
  // AI 코멘트는 여기서 자동 생성하지 않음 — '오늘 코멘트 생성' 버튼을 눌러야 생성
})();
</script>
